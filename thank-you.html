<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Tiny Bloom</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&family=Allura&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Source Sans 3",sans-serif;background:#160d0a;color:#f1dfc8;min-height:100vh;display:flex;flex-direction:column}a{color:inherit;text-decoration:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 5%;border-bottom:1px solid rgba(224,178,123,.12)}
.logo{font-family:"Libre Baskerville",serif;font-size:24px;color:#ead3b5}.logo span{color:#c99a63}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:50px 5%}
.card{max-width:560px;width:100%;text-align:center;padding:42px 28px;border-radius:24px;border:1px solid rgba(201,154,99,.25);background:radial-gradient(circle at 50% 0%,rgba(157,91,52,.14),transparent 55%),rgba(40,23,17,.7)}
.heart{font-size:42px;color:#d2a06a;margin-bottom:10px}
.eyebrow{color:#c99a63;font-size:10px;letter-spacing:4px;margin-bottom:12px}
h1{font-family:"Libre Baskerville",serif;font-weight:400;font-size:clamp(34px,5vw,48px);color:#ead8c2;line-height:1.15}
h1 em{display:block;font-family:"Allura",cursive;font-style:normal;color:#d2a06a;font-size:clamp(28px,4vw,40px);margin-top:6px}
.msg{margin:18px auto 0;max-width:400px;color:#bfa890;font-size:14px;line-height:1.8}
.box{margin:28px auto 0;padding:18px;border-radius:16px;border:1px solid rgba(201,154,99,.2);background:rgba(22,13,10,.5);text-align:left}
.box p{color:#a9917d;font-size:13px;line-height:1.7;margin:6px 0}.box strong{color:#e7ceb1}
.arrival{margin-top:14px;color:#d2a06a;font-size:14px}
.actions{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 24px;border-radius:30px;background:linear-gradient(135deg,#bd8146,#81502e);color:#180b06;font-size:11px;font-weight:700;letter-spacing:1.5px}
.btn-outline{border:1px solid rgba(222,186,148,.45);background:transparent;color:#E2CDB5}
</style>
</head>
<body>
<header class="topbar"><a class="logo" href="index.html">TINY <span>BLOOM</span></a></header>
<main class="main"><div class="card">
<div class="heart">&#9825;</div>
<div class="eyebrow">ORDER CONFIRMED</div>
<h1>Thank you<em>for your order</em></h1>
<p class="msg" id="msg">We&#8217;re preparing your little one with care.</p>
<div class="box"><p><strong id="item">&mdash;</strong></p><p id="customer">&mdash;</p><p id="address">&mdash;</p><p class="arrival" id="arrival">Estimated arrival: &mdash;</p></div>
<div class="actions"><a class="btn" href="index.html">RETURN TO HOME</a><a class="btn btn-outline" href="shop.html">CONTINUE SHOPPING</a></div>
</div></main>
<script>
const receipt=JSON.parse(localStorage.getItem("tinyBloomReceipt")||"null");
if(!receipt){document.getElementById("msg").textContent="No recent order found. Browse the shop to find your little one."}
else{const o=receipt.order,c=receipt.customer;document.getElementById("msg").textContent="Thank you, "+(c.fullName.split(" ")[0]||"friend")+". Your order is confirmed and will be packed with love.";document.getElementById("item").textContent=o.name+" x "+o.qty+"  |  $"+o.total;document.getElementById("customer").textContent=c.fullName+" | "+c.email+" | "+c.phone;document.getElementById("address").textContent=c.address+", "+c.city+" "+c.postal+", "+c.country;document.getElementById("arrival").textContent="Estimated arrival: "+receipt.arrival.start+" - "+receipt.arrival.end}
</script>
</body>
</html>
